driver: apix_s8
auth:
  method: digest

endpoints:
  network:
    url: /cgi-bin/admin/admin.cgi?action=set.network.tcp&format=json
    method: POST
  time:
    url: /cgi-bin/admin/admin.cgi?action=set.system.datetime&format=json
    method: POST
  motion:
    url: /cgi-bin/operator/operator.cgi?action=update.event.motion.detection&format=json
    method: POST
  streams:
    url: /cgi-bin/operator/operator.cgi?action=set.video.general&format=json
    method: POST
